name: ardas-local

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ardas
      POSTGRES_PASSWORD: ardas
      POSTGRES_USER: ardas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ardas -d ardas"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ardas-postgres-data:/var/lib/postgresql

volumes:
  ardas-postgres-data:
