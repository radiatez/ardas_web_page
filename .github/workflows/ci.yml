name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ardas_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ardas_ci

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: ardas_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ardas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to clean PostgreSQL
        run: pnpm run db:migrate

      - name: Verify migration metadata
        run: pnpm run db:check

      - name: Verify migration reproducibility
        run: |
          pnpm run db:generate
          git diff --exit-code -- drizzle

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Audit production dependencies
        run: pnpm run audit:prod

      - name: Install supported browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Browser, responsive and accessibility regression
        run: pnpm run test:e2e

      - name: Backup and restore recovery drill
        run: pnpm run drill:recovery

      - name: Validate rollback contract
        run: pnpm run validate:rollback
